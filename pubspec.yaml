name: scholarsync
description: "ScholarSync — Your smart student companion for academic success."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Routing
  go_router: ^14.0.0

  # State Management
  provider: ^6.1.2

  # Typography
  google_fonts: ^6.2.1

  # SVG Support
  flutter_svg: ^2.0.10+1

  # Firebase
  firebase_core: ^3.13.1
  firebase_auth: ^5.5.2
  firebase_messaging: ^15.2.4

  # Google Sign-In
  google_sign_in: ^6.2.2

  # Supabase (Database / Storage / Auth Bridge)
  supabase_flutter: ^2.8.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
